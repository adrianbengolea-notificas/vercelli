# Firebase App Hosting — backend Next.js de EVHSA
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 8
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_SITE_NAME
    value: EVHSA
    availability:
      - BUILD
      - RUNTIME
  # No commitear la apiKey: GitHub Secret Scanning la marca como Google API Key.
  # Crear el secreto con:
  #   firebase apphosting:secrets:set NEXT_PUBLIC_FIREBASE_API_KEY --project vercelli-2665c
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: vercelli-2665c.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: vercelli-2665c
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: vercelli-2665c.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "641113588096"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:641113588096:web:ec4453a34669f5da010165
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-L7TSSZJK45
    availability:
      - BUILD
      - RUNTIME
  - variable: ORIGINAL_SITE_URL
    value: https://www.e-evhsa.com.ar
    availability:
      - RUNTIME
  - variable: GPS_EVHSA_URL
    value: https://gpsevhsa.com
    availability:
      - RUNTIME
